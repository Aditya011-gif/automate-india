services:
  - type: web
    name: agrichain-whatsapp-cloud-api
    runtime: node
    plan: free
    region: oregon
    rootDir: whatsapp_cloud_api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: WHATSAPP_VERIFY_TOKEN
        value: agrichain_webhook_secret_2026
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: agrichain-official-app
      - key: FIREBASE_WEB_API_KEY
        value: AIzaSyA-UWJeooM7f7u-hvOR6p9RpNiUcUYbQUc
